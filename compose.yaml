services:
  sla-gen:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
      OAKESTRA_SLA_MODEL: ${OAKESTRA_SLA_MODEL:-qwen/qwen3.8-27b}
    # Docker Desktop resolves host.docker.internal on its own; on Linux it needs this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
