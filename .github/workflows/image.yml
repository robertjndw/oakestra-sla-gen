name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend checks
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm check:classes
          pnpm typecheck
          pnpm test

  # The addon UI links the dashboard's SDK and UI packages from source, so it needs a checkout of
  # the dashboard at the commit pinned in DASHBOARD_REF.
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: oakestra-sla-gen

      - id: ref
        run: echo "ref=$(cat oakestra-sla-gen/frontend/addon/DASHBOARD_REF)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: robertjndw/oakestra-dashboard-v2
          ref: ${{ steps.ref.outputs.ref }}
          path: oakestra-dashboard-v2
          # A private dashboard repo needs a PAT with read access in DASHBOARD_REPO_TOKEN; the
          # default token only covers this repo.
          token: ${{ secrets.DASHBOARD_REPO_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: oakestra-sla-gen/frontend/addon/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            oakestra-dashboard-v2/pnpm-lock.yaml
            oakestra-sla-gen/frontend/pnpm-lock.yaml
            oakestra-sla-gen/frontend/addon/pnpm-lock.yaml
      - name: Install dashboard packages
        working-directory: oakestra-dashboard-v2
        run: pnpm install --frozen-lockfile --filter "@oakestra/dashboard-sdk..." --filter "@oakestra/ui..."
      # The addon resolves react and friends from frontend/node_modules.
      - name: Install frontend
        working-directory: oakestra-sla-gen/frontend
        run: pnpm install --frozen-lockfile
      - name: Addon checks
        working-directory: oakestra-sla-gen/frontend/addon
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

  build:
    needs: [checks, addon]
    runs-on: ubuntu-latest
    # Only this job pushes images, so checks doesn't get packages: write. On PRs the token is
    # never used here: login and push are skipped, and docker build doesn't receive it.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: oakestra-sla-gen
            file: oakestra-sla-gen/Dockerfile
            image: oakestra-sla-gen
          - context: oakestra-sla-gen/frontend
            file: oakestra-sla-gen/frontend/Dockerfile
            image: oakestra-sla-gen-frontend
          - context: oakestra-sla-gen/frontend
            file: oakestra-sla-gen/frontend/addon/Dockerfile
            image: oakestra-sla-gen-addon-ui
            dashboard: true
    steps:
      - uses: actions/checkout@v7
        with:
          path: oakestra-sla-gen

      - id: ref
        if: matrix.dashboard
        run: echo "ref=$(cat oakestra-sla-gen/frontend/addon/DASHBOARD_REF)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: matrix.dashboard
        with:
          repository: robertjndw/oakestra-dashboard-v2
          ref: ${{ steps.ref.outputs.ref }}
          path: oakestra-dashboard-v2
          token: ${{ secrets.DASHBOARD_REPO_TOKEN || github.token }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # The Oakestra marketplace pulls these images on the root orchestrator host, which is often
      # an ARM board, so both architectures are published.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.dashboard && 'dashboard=oakestra-dashboard-v2' || '' }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
