name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend checks
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm check:classes
          pnpm typecheck
          pnpm test

  # The addon's @oakestra/* dependencies come from GitHub Packages, which needs a token even for
  # public packages. pnpm only reads it from the user npmrc, which setup-node writes.
  addon:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/addon/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@oakestra"
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            frontend/addon/pnpm-lock.yaml
      # The addon resolves react and friends from frontend/node_modules.
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Addon checks
        working-directory: frontend/addon
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

  build:
    needs: [checks, addon]
    runs-on: ubuntu-latest
    # Only this job pushes images, so checks doesn't get packages: write. On PRs login and push
    # are skipped. The addon build gets the token as a secret to install its @oakestra/*
    # packages. Fork PRs only get a read-only token.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            file: Dockerfile
            image: oakestra-sla-gen
          - context: frontend
            file: frontend/Dockerfile
            image: oakestra-sla-gen-frontend
          - context: frontend
            file: frontend/addon/Dockerfile
            image: oakestra-sla-gen-addon-ui
            packages: true
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # The Oakestra marketplace pulls these images on the root orchestrator host, which is often
      # an ARM board, so both architectures are published.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          secrets: ${{ matrix.packages && format('node_auth_token={0}', secrets.GITHUB_TOKEN) || '' }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
