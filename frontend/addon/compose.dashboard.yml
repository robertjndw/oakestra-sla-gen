# Runs the playground as a UI addon inside the dashboard's dev stack (mock addons manager and
# mock system-manager, no real Oakestra). Paths in an override file resolve against the first
# -f file's directory, which is why they start from the dashboard checkout, not from here.
#
# Needs oakestra-dashboard-v2 and oakestra-sla-gen checked out side by side. From the dashboard
# checkout (the commit in DASHBOARD_REF is known to work):
#
#   docker compose -f docker-compose.dev.yml \
#     -f ../oakestra-sla-gen/frontend/addon/compose.dashboard.yml up --build -d
#
# Then register and enable the addon at the mock addons manager:
#
#   curl -X PUT http://localhost:11101/__test/addons/sla-generator \
#     -H 'content-type: application/json' \
#     -d '{"enabled": true, "version": "0.1.0", "sdk": "^0.1.0"}'
#
# Open http://localhost:8080 and log in as Admin / Admin. The LLM is read from OPENAI_BASE_URL
# (default: LM Studio on the host); set OPENAI_BASE_URL, OPENAI_API_KEY, OAKESTRA_SLA_MODEL and
# OAKESTRA_SLA_METHOD in the environment to change it.
services:
  # The dashboard's nginx proxies /addon-assets/sla-generator/ to this name.
  addonui-sla-generator:
    build:
      context: ../oakestra-sla-gen/frontend
      dockerfile: addon/Dockerfile
      additional_contexts:
        dashboard: .
    environment:
      API_UPSTREAM: http://sla-gen:8000
    depends_on:
      - sla-gen

  sla-gen:
    build: ../oakestra-sla-gen
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
      OAKESTRA_SLA_MODEL: ${OAKESTRA_SLA_MODEL:-qwen/qwen3.8-27b}
      OAKESTRA_SLA_METHOD: ${OAKESTRA_SLA_METHOD:-prompt}
    # Docker Desktop resolves host.docker.internal on its own; on Linux it needs this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
